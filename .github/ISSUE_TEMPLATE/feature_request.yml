name: Feature request
description: Suggest an engine, variable or behavior improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New server engine (SERVER_TYPE)
        - Existing engine behavior
        - Java / performance tuning
        - Egg variables
        - Docker image
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to host or achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Concrete behavior, variables or flags you would expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the [docs](https://minecraft-eggs.docs.potenfyr.in) and this is not already supported
          required: true
        - label: I searched existing issues for a duplicate
          required: true
