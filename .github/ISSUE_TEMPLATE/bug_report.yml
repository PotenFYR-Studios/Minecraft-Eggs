name: Bug report
description: "Something broke: a failed install, crash loop, wrong stop behavior, …"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Console logs are the fastest path to a fix,
        please include the relevant section (boot card + error) rather than the entire log.
  - type: dropdown
    id: panel
    attributes:
      label: Panel
      description: Which panel is running this egg?
      options:
        - Pterodactyl
        - Pelican
        - Feather Panel
        - Wisp
        - Plain Docker / other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Panel & daemon version
      description: e.g. Pterodactyl 1.11.13 + Wings 1.11.13
    validations:
      required: true
  - type: input
    id: server-type
    attributes:
      label: SERVER_TYPE / MINECRAFT_VERSION
      description: e.g. paper / 1.21.4 (plus BUILD_NUMBER or LOADER_VERSION if set)
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - Install (Reinstall / first boot)
        - Startup (after install, server fails to start)
        - Runtime (crash during play)
        - Stop (server hangs or dies wrong)
        - Docs / other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console log
      description: Boot card plus the error. Set DEBUG=1 and Reinstall for verbose output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Architecture (amd64/arm64), memory allocation, custom variables, forked image, …
