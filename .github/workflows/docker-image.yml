name: Build & Publish Docker Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: potenfyr-studios/minecraft-eggs

permissions:
  contents: read

jobs:
  behavior-tests:
    name: Panel Behavior Tests (docker lifecycle suite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run panel-behavior test suite
        shell: bash
        run: |
          docker build -t mc-eggs-test -f tests/Dockerfile.test . >/dev/null
          bash tests/panel-test.sh

  # Per-architecture NATIVE builds: amd64 on x64 runners, arm64 on GitHub's
  # free arm64 runners. No QEMU anywhere anymore (arm64 used to emulate for
  # every push). Each leg pushes by digest with its own cache scope; the
  # merge job stitches the digests into one multi-arch manifest.
  build:
    name: Build image (${{ matrix.slug }})
    needs: behavior-tests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            JAVA_VERSION=all
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: type=gha,scope=build-${{ matrix.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-architecture digests into the published multi-arch tags.
  merge:
    name: Merge manifest & publish tags
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${IMAGE_NAME}"
          TAGS="${IMAGE_URI}:latest"
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAGS="${TAGS},${IMAGE_URI}:master-${GITHUB_SHA::7}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Merge manifest lists and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          ARGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for t in "${TAG_LIST[@]}"; do ARGS="${ARGS} --tag ${t}"; done
          # shellcheck disable=SC2046
          docker buildx imagetools create ${ARGS} \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          echo "Published multi-arch image:"
          docker buildx imagetools inspect "${TAG_LIST[0]}"
